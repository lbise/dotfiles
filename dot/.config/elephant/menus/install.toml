# Install submenu, reached from the main menu (leo.toml).
name = "install"
parent = "leo"
name_pretty = "Install"
hide_name_pretty_prefix = true
icon = "system-software-install-symbolic"
fixed_order = true

[[entries]]
text = "Package"
subtext = "Repos + AUR"
icon = "system-software-install-symbolic"
actions = { "install" = "system-exec-float.sh 'Install package' system-pkg-install.sh all" }

[[entries]]
text = "AUR"
subtext = "AUR only"
icon = "system-software-install-symbolic"
actions = { "install" = "system-exec-float.sh 'Install AUR package' system-pkg-install.sh aur" }

[[entries]]
text = "Docker"
subtext = "Engine, compose, service and group"
icon = "system-software-install-symbolic"
actions = { "install" = "system-exec-float.sh 'Install Docker' system-install-docker.sh" }
