# fcitx5 input method configuration for Hyprland (Wayland).
# GTK 3/4 apps reach fcitx5 through the Wayland text-input protocol, so
# GTK_IM_MODULE stays unset: fcitx5 warns when it is set on Wayland.
# https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland
# Qt 6: Wayland text-input first, the fcitx plugin as fallback.
QT_IM_MODULES=wayland;fcitx
# Qt 5 ignores QT_IM_MODULES.
QT_IM_MODULE=fcitx
# XWayland apps use XIM.
XMODIFIERS=@im=fcitx
