# GTK 4.20+ on Wayland leaves dead keys and compose to an input method and
# drops them when none runs. "simple" brings back GTK's built-in compose.
# No input method (fcitx5/IBus) on purpose: it steals text fields in apps
# like Blender. https://github.com/ghostty-org/ghostty/discussions/8899
GTK_IM_MODULE=simple
