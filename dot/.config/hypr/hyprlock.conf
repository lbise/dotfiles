# Leo login/lock pair. Colours and sizes come from the desktop palette.
source = ~/.config/leo/theme/hyprlock.conf

# The wallpaper, never a screenshot of the open session.
background {
    monitor =
    path = ~/.config/leo/wallpaper/current.jpg
    color = $lock_background
    blur_passes = 1
    blur_size = 2
    noise = 0
    contrast = 1
    brightness = 0.55
    vibrancy = 0
    vibrancy_darkness = 0
}

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 2500
}

# Keep the real PAM and fingerprint authentication paths.
auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Checking fingerprint…
}

animations {
    enabled = false
}

# Layout grid, shared with the SDDM theme: the 400×240 card is centred 100px
# below the screen centre. Inside it, 36px padding and three 48px rows with
# 12px gaps put the password field on the card's centre line. Positions below
# are Hyprlock offsets (y up) from the screen centre: card row r → y = 20 - r.

label {
    monitor =
    text = <span weight="500">$TIME</span>
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_clock_size
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B %Y"
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_font_size
    position = 0, 90
    halign = center
    valign = center
}

# Popup lift from DESIGN.md (black, soft, 10px down). Hyprlock shadows have no
# offset, so a dark copy of the card sits 10px lower and casts the blur.
shape {
    monitor =
    size = 400, 240
    color = rgba(00000059)
    rounding = $lock_card_radius
    position = 0, -110
    halign = center
    valign = center
    zindex = 0
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000073)
}

# The card, matching the Quickshell popup shape and colours.
shape {
    monitor =
    size = 400, 240
    color = $lock_surface
    border_color = $lock_rule
    border_size = 1
    rounding = $lock_card_radius
    position = 0, -100
    halign = center
    valign = center
    zindex = 1
}

# Row 1: who is locked, and since when. Same slot as the login username.
label {
    monitor =
    text = <span weight="600">$USER</span>
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_font_size
    position = 0, -26
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:0] date +"Locked at %H:%M"
    color = $lock_muted
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 0, -50
    halign = center
    valign = center
    zindex = 2
}

# Row 2: the password field, on the card's centre line. It always has focus,
# so it carries the jade focus ring, like the focused login field.
input-field {
    monitor =
    size = 344, 48
    position = 0, -100
    halign = center
    valign = center
    zindex = 2
    inner_color = $lock_background
    outer_color = $lock_accent
    outline_thickness = 1
    rounding = $lock_input_radius
    font_family = $lock_font
    font_color = $lock_foreground
    placeholder_text = <span size="$lock_input_text_size" foreground="$lock_muted_hex">Password</span>
    check_text = <span size="$lock_input_text_size">Checking…</span>
    check_color = $lock_accent
    fail_text = <span size="$lock_input_text_size">Unlock failed. Try again.</span>
    fail_color = $lock_alert
    capslock_color = $lock_warning
    swap_font_color = false
    fade_on_empty = false
    hide_input = false
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
}

# Row 3: Hyprlock submits with Enter. This is a hint, not a fake button.
label {
    monitor =
    text = <span foreground="$lock_muted_hex"><span font_family="JetBrainsMono Nerd Font Propo" size="115%">󰌑</span></span> Press Enter to unlock
    color = $lock_muted
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 0, -160
    halign = center
    valign = center
    zindex = 2
}

# Fingerprint status sits under the card, where login shows its feedback.
label {
    monitor =
    text = $FPRINTPROMPT
    color = $lock_muted
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 0, -247
    halign = center
    valign = center
    zindex = 2
}

# Bottom left: the active keyboard layout; a click cycles layouts.
label {
    monitor =
    text = <span foreground="$lock_muted_hex"><span font_family="JetBrainsMono Nerd Font Propo" size="115%">󰌌</span></span> $LAYOUT
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 40, 34
    halign = left
    valign = bottom
    onclick = hyprctl switchxkblayout all next
}

# Bottom right: power actions in a bar group, as on the login screen.
# Measured with pango-view: labels are 25px tall, text is one 10px cell per
# character and the glyph about 17px. The group is 44px tall with 16px/18px
# end padding and 28px between actions (Suspend 97, Restart 92, Shut down 112).
shape {
    monitor =
    size = 391, 44
    color = $lock_background
    border_color = $lock_rule
    border_size = 1
    rounding = 11
    position = -24, 24
    halign = right
    valign = bottom
    zindex = 1
}

# Restart and shutdown need a second click within three seconds and then read
# "Confirm" in rose. All commands run through one helper; no authentication
# bypass or external unlock command.
label {
    monitor =
    text = <span foreground="$lock_muted_hex"><span font_family="JetBrainsMono Nerd Font Propo" size="115%">󰒲</span></span> Suspend
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -302, 34
    halign = right
    valign = bottom
    zindex = 2
    onclick = ~/.scripts/system/system-lock-power.py suspend
}

label {
    monitor =
    text = cmd[update:500] ~/.scripts/system/system-lock-power-status.sh reboot --markup '$lock_muted_hex' '$lock_alert_hex'
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -182, 34
    halign = right
    valign = bottom
    zindex = 2
    onclick = ~/.scripts/system/system-lock-power.py reboot
}

label {
    monitor =
    text = cmd[update:500] ~/.scripts/system/system-lock-power-status.sh poweroff --markup '$lock_muted_hex' '$lock_alert_hex'
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -42, 34
    halign = right
    valign = bottom
    zindex = 2
    onclick = ~/.scripts/system/system-lock-power.py poweroff
}
