# Leo login/lock pair. Colours and sizes come from the desktop palette.
source = ~/.config/leo/theme/hyprlock.conf

# The wallpaper, never a screenshot of the open session.
background {
    monitor =
    path = ~/.config/leo/wallpaper/current.jpg
    color = $lock_background
    blur_passes = 1
    blur_size = 2
    noise = 0
    contrast = 1
    brightness = 0.55
    vibrancy = 0
    vibrancy_darkness = 0
}

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 2500
}

# Keep the real PAM and fingerprint authentication paths.
auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Checking fingerprint…
}

animations {
    enabled = false
}

label {
    monitor =
    text = $TIME
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_clock_size
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B %Y"
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_font_size
    position = 0, 90
    halign = center
    valign = center
}

# A single panel, matching the Quickshell popup shape and colours.
shape {
    monitor =
    size = 400, 240
    color = $lock_surface
    border_color = $lock_rule
    border_size = 1
    rounding = $lock_card_radius
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000050)
}

label {
    monitor =
    text = $USER
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_font_size
    position = 0, -38
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 344, 48
    position = 0, -100
    halign = center
    valign = center
    zindex = 1
    inner_color = $lock_background
    outer_color = $lock_rule
    outline_thickness = 1
    rounding = $lock_input_radius
    font_family = $lock_font
    font_color = $lock_foreground
    placeholder_text = <span size="$lock_input_text_size" foreground="$lock_muted_hex">Password</span>
    check_text = <span size="$lock_input_text_size">Checking…</span>
    check_color = $lock_accent
    fail_text = <span size="$lock_input_text_size">Try again</span>
    fail_color = $lock_alert
    capslock_color = $lock_warning
    swap_font_color = false
    fade_on_empty = false
    hide_input = false
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
}

# Hyprlock submits with Enter. This is a hint, not a fake clickable button.
label {
    monitor =
    text = Press Enter to unlock
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 0, -157
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $lock_muted
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 0, -188
    halign = center
    valign = center
    zindex = 1
}

# Make an unexpected keyboard layout visible, and allow switching it.
label {
    monitor =
    text = $LAYOUT
    color = $lock_muted
    font_family = $lock_font
    font_size = $lock_hint_size
    position = 28, 28
    halign = left
    valign = bottom
    onclick = hyprctl switchxkblayout all next
}

# Restart and shutdown need a second click within three seconds. All commands
# run through one helper; no authentication bypass or external unlock command.
label {
    monitor =
    text = Suspend
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -380, 28
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py suspend
}

label {
    monitor =
    text = cmd[update:500] ~/.scripts/system/system-lock-power-status.sh reboot
    color = $lock_foreground
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -200, 28
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py reboot
}

label {
    monitor =
    text = cmd[update:500] ~/.scripts/system/system-lock-power-status.sh poweroff
    color = $lock_alert
    font_family = $lock_font
    font_size = $lock_hint_size
    position = -28, 28
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py poweroff
}
