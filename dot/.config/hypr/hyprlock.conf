# Leo login/lock pair. Colours and sizes come from the desktop palette.
source = ~/.config/leo/theme/hyprlock.conf

# The wallpaper, never a screenshot of the open session.
background {
    monitor =
    path = ~/.config/leo/wallpaper/current.jpg
    color = $lock_background
    blur_passes = 1
    blur_size = 2
    noise = 0
    contrast = 1
    brightness = 0.55
    vibrancy = 0
    vibrancy_darkness = 0
}

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 2500
}

# Keep the real PAM and fingerprint authentication paths.
auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint
    fingerprint:present_message = Checking fingerprint…
}

animations {
    enabled = false
}

# Shared grid with the SDDM theme (Main.qml): every element is placed by its
# box centre relative to the screen centre. Hyprlock offsets point up, so the
# login theme's offsets appear here with the opposite sign.
#
#   clock -150 · date -60 · name +56 · field +110 · message +164
#
# Corner controls sit 24px in from the bottom edges and are 36px tall.

# Time and date, in the display face.
label {
    monitor =
    text = <span weight="300">$TIME</span>
    color = $lock_foreground
    font_family = $lock_display_font
    font_size = $lock_clock_size
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B'
    color = $lock_muted
    font_family = $lock_text_font
    font_size = $lock_text_size
    position = 0, 60
    halign = center
    valign = center
}

# The account, where login shows its editable name.
label {
    monitor =
    text = <span weight="500">$USER</span>
    color = $lock_foreground
    font_family = $lock_text_font
    font_size = $lock_text_size
    position = 0, -56
    halign = center
    valign = center
}

# The ground pill with its outline; 318×46 plus the outline renders 320×48,
# as at login. It always has focus, so it carries the jade focus ring.
# Failure and progress read inside the field, as at login. Enter submits.
input-field {
    monitor =
    size = 318, 46
    position = 0, -110
    halign = center
    valign = center
    inner_color = $lock_background
    outer_color = $lock_accent
    outline_thickness = 1
    rounding = -1
    font_family = $lock_text_font
    font_color = $lock_foreground
    placeholder_text = <span size="$lock_field_text_size" foreground="$lock_muted_hex">Password</span>
    check_text = <span size="$lock_field_text_size">Checking…</span>
    check_color = $lock_accent
    fail_text = <span size="$lock_field_text_size">Wrong password</span>
    fail_color = $lock_alert
    capslock_color = $lock_warning
    swap_font_color = false
    fade_on_empty = false
    hide_input = false
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
}

# Fingerprint status, where login shows its one feedback line. Empty unless
# a reader is present.
label {
    monitor =
    text = $FPRINTPROMPT
    color = $lock_muted
    font_family = $lock_text_font
    font_size = $lock_message_size
    position = 0, -164
    halign = center
    valign = center
}

# Bottom left: the keyboard layout as a pill chip; a click cycles layouts.
# The list mirrors kb_layout in hyprland.lua, one name per layout, in order.
# The label (space, glyph, space, two letters, space) measures 54px with
# pango-view at 96 DPI, so it starts 6px inside the 66px chip.
shape {
    monitor =
    size = 66, 36
    color = $lock_control_fill
    rounding = -1
    position = 24, 24
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span size="$lock_chip_text_size"> <span font_family="JetBrainsMono Nerd Font Propo" size="$lock_chip_glyph_size">󰌌</span> $LAYOUT[ch] </span>
    color = $lock_foreground
    font_family = $lock_font
    font_size = 10
    position = 30, 30
    halign = left
    valign = bottom
    onclick = hyprctl switchxkblayout all next
}

# Bottom right: Suspend, Restart and Shut down as 36px discs, 8px apart.
# Each label is the glyph padded by a space either side (32, 27 and 27px
# wide, 24px tall in pango-view), centred on its disc.
# Restart and shutdown need a second click within three seconds; the prompt
# above the buttons says so. No authentication bypass or unlock command.
shape {
    monitor =
    size = 36, 36
    color = $lock_control_fill
    rounding = -1
    position = -112, 24
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 36, 36
    color = $lock_control_fill
    rounding = -1
    position = -68, 24
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 36, 36
    color = $lock_control_fill
    rounding = -1
    position = -24, 24
    halign = right
    valign = bottom
}

label {
    monitor =
    text = <span size="$lock_chip_text_size"> <span font_family="JetBrainsMono Nerd Font Propo" size="$lock_chip_glyph_size">󰒲</span> </span>
    color = $lock_foreground
    font_family = $lock_font
    font_size = 10
    position = -114, 30
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py suspend
}

label {
    monitor =
    text = <span size="$lock_chip_text_size"> <span font_family="JetBrainsMono Nerd Font Propo" size="$lock_chip_glyph_size">󰜉</span> </span>
    color = $lock_foreground
    font_family = $lock_font
    font_size = 10
    position = -72, 30
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py reboot
}

label {
    monitor =
    text = <span size="$lock_chip_text_size"> <span font_family="JetBrainsMono Nerd Font Propo" size="$lock_chip_glyph_size">󰐥</span> </span>
    color = $lock_alert
    font_family = $lock_font
    font_size = 10
    position = -28, 30
    halign = right
    valign = bottom
    onclick = ~/.scripts/system/system-lock-power.py poweroff
}

# While restart or shutdown is armed, one rose line sits 12px above the
# buttons, right-aligned with them, where login raises its confirmation card.
label {
    monitor =
    text = cmd[update:500] ~/.scripts/system/system-lock-power-status.sh pending --markup '$lock_alert_hex'
    color = $lock_alert
    font_family = $lock_font
    font_size = 10
    position = -24, 72
    halign = right
    valign = bottom
}
